<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f0f0f0"/>
  
  <!-- Character 1 - Technical -->
  <g transform="translate(200, 315)">
    <ellipse cx="0" cy="100" rx="80" ry="20" fill="#ccc" opacity="0.3"/>
    <rect x="-30" y="0" width="60" height="100" rx="30" fill="#4169e1"/>
    <circle cx="0" cy="-40" r="40" fill="#ffdbac"/>
    <circle cx="-15" cy="-45" r="5" fill="#000"/>
    <circle cx="15" cy="-45" r="5" fill="#000"/>
    <rect x="-50" y="20" width="20" height="60" rx="10" fill="#4169e1"/>
    <rect x="30" y="20" width="20" height="60" rx="10" fill="#4169e1"/>
    <text x="0" y="150" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Technical PM</text>
  </g>
  
  <!-- Character 2 - Leadership -->
  <g transform="translate(600, 315)">
    <ellipse cx="0" cy="100" rx="80" ry="20" fill="#ccc" opacity="0.3"/>
    <rect x="-30" y="0" width="60" height="100" rx="30" fill="#228b22"/>
    <circle cx="0" cy="-40" r="40" fill="#ffdbac"/>
    <circle cx="-15" cy="-45" r="5" fill="#000"/>
    <circle cx="15" cy="-45" r="5" fill="#000"/>
    <rect x="-50" y="20" width="20" height="60" rx="10" fill="#228b22"/>
    <rect x="30" y="20" width="20" height="60" rx="10" fill="#228b22"/>
    <text x="0" y="150" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Product Leader</text>
  </g>
  
  <!-- Character 3 - Creative -->
  <g transform="translate(1000, 315)">
    <ellipse cx="0" cy="100" rx="80" ry="20" fill="#ccc" opacity="0.3"/>
    <rect x="-30" y="0" width="60" height="100" rx="30" fill="#ff6347"/>
    <circle cx="0" cy="-40" r="40" fill="#ffdbac"/>
    <circle cx="-15" cy="-45" r="5" fill="#000"/>
    <circle cx="15" cy="-45" r="5" fill="#000"/>
    <rect x="-50" y="20" width="20" height="60" rx="10" fill="#ff6347"/>
    <rect x="30" y="20" width="20" height="60" rx="10" fill="#ff6347"/>
    <text x="0" y="150" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Innovation</text>
  </g>
  
  <text x="600" y="80" font-family="Arial" font-size="36" font-weight="bold" fill="#333" text-anchor="middle">Three AI Personas</text>
  <text x="600" y="550" font-family="Arial" font-size="20" fill="#666" text-anchor="middle">Each character emphasizes different skill dimensions</text>
</svg>
