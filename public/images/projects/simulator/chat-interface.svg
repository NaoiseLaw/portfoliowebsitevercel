<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Chat window -->
  <rect x="100" y="100" width="1000" height="430" rx="20" fill="#fff" stroke="#ddd" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="100" y="100" width="1000" height="60" rx="20" fill="#2196F3"/>
  <text x="150" y="140" font-family="Arial" font-size="24" font-weight="bold" fill="white">Naoise Law - AI Product Manager</text>
  
  <!-- Messages -->
  <g transform="translate(150, 200)">
    <!-- User message -->
    <rect x="500" y="0" width="450" height="60" rx="10" fill="#e3f2fd"/>
    <text x="520" y="30" font-family="Arial" font-size="16" fill="#333">Tell me about your technical experience</text>
    
    <!-- AI response -->
    <rect x="0" y="80" width="900" height="120" rx="10" fill="#f5f5f5"/>
    <text x="20" y="110" font-family="Arial" font-size="14" fill="#333">I'm excited to discuss my AI and automation background!</text>
    <text x="20" y="135" font-family="Arial" font-size="14" fill="#333">My hackathon-winning sentiment analysis platform achieved</text>
    <text x="20" y="160" font-family="Arial" font-size="14" fill="#333">94% accuracy using Python, BERT, and CNN models...</text>
    <text x="20" y="185" font-family="Arial" font-size="14" fill="#2196F3" font-weight="bold">🔗 View Project</text>
  </g>
  
  <!-- Input area -->
  <rect x="120" y="480" width="880" height="40" rx="20" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="140" y="505" font-family="Arial" font-size="16" fill="#999">Ask any question about my experience...</text>
  <circle cx="1040" cy="500" r="15" fill="#2196F3"/>
  <text x="1034" y="507" font-size="14" fill="white">➤</text>
  
  <text x="600" y="560" font-family="Arial" font-size="18" fill="#666" text-anchor="middle">Powered by Google Gemini AI</text>
</svg>
